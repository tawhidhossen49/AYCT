<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <meta name="description" content="Sign in to the Amaze Youth Chess Tournament portal.">
  <title>Sign in · Amaze Youth Chess Tournament</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
</head>
<body>
  <a href="index.html" class="back-link"><img src="assets/brand/logo.png" alt=""><i class="ph-bold ph-arrow-left"></i> Back to the tournament</a>

  <main class="login">
    <div class="login-art" aria-hidden="true">
      <img src="assets/brand/scenes/king.webp" alt="" data-login-art width="1920" height="1080">
      <span class="ghost">Your move</span>
    </div>

    <section class="panel lit login-card" data-reveal="load">
      <span class="eyebrow">Tournament portal</span>
      <h1 class="login-title">
        <span class="display" data-split="load">Amaze Youth Chess</span>
        <span class="display-light chrome-text">Tournament <span id="year">2027</span></span>
      </h1>
      <p class="muted mt-4">Sign in to see your group, your next game and the live boards.</p>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" autocomplete="current-password" required>
          <p class="field-error" id="formError" role="alert"></p>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit">Sign in <i class="ph-bold ph-arrow-right" aria-hidden="true"></i></button>
      </form>

      <p class="login-foot">New here? Register from the <a href="index.html" style="text-decoration:underline">main page</a>. The organisers send you your sign-in once your place is confirmed.</p>
    </section>
  </main>

  <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
